[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfleet-planner"
version = "0.1.0"
description = "Offline desired-state and capacity planning for agent worker pools"
requires-python = ">=3.10"
authors = [{name = "Asadullah Shafique"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agentfleet = "agentfleet.cli:main"

[tool.setuptools.packages.find]
include = ["agentfleet*"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "jsonschema>=4.18"]

[tool.setuptools.package-data]
agentfleet = ["snapshot.schema.json"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.mypy]
check_untyped_defs = true
